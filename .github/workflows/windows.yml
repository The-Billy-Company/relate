# Native Windows is a runtime contract, not a cross-compilation claim. This
# lane exercises the CLI, the atlas path, and the installer on NTFS and the
# Windows process API on both supported architectures.
name: windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  native:
    name: native (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            zig_arch: x86_64
            runner: windows-2025
          - arch: arm64
            zig_arch: aarch64
            runner: windows-11-arm
    defaults:
      run:
        working-directory: relate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: relate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/irregex
          path: irregex
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/gist
          path: gist
          persist-credentials: false

      - name: Provision Zig
        shell: pwsh
        run: |
          $ver = $env:ZIG_VERSION
          $floor = Select-String -Path build.zig.zon -Pattern '\.minimum_zig_version = "([^"]+)"'
          if (-not $floor) { throw 'no minimum_zig_version in build.zig.zon' }
          $declared = $floor.Matches[0].Groups[1].Value
          if ($declared -ne $ver) { throw "workflow pins zig $ver, build.zig.zon declares $declared" }

          $target = '${{ matrix.zig_arch }}-windows'
          $index = Invoke-RestMethod -Uri 'https://ziglang.org/download/index.json'
          $release = $index.$ver
          if (-not $release) { throw "ziglang.org carries no $ver release" }
          $build = $release.$target
          if (-not $build) { throw "zig $ver has no $target build" }

          $zip = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest -Uri $build.tarball -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          if ($got -ne $build.shasum) { throw "sha256 mismatch: got $got, expected $($build.shasum)" }

          $into = Join-Path $env:RUNNER_TEMP 'zig'
          New-Item -ItemType Directory -Force -Path $into | Out-Null
          tar.exe -xf $zip -C $into
          if ($LASTEXITCODE -ne 0) { throw "tar could not extract the Zig archive" }
          $root = (Get-ChildItem -Directory -LiteralPath $into | Select-Object -First 1).FullName
          if (-not $root) { throw "the archive extracted no directory into $into" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $root
          if ((& (Join-Path $root 'zig.exe') version) -ne $ver) { throw 'provisioned Zig reports the wrong version' }

      - name: Test and build shipped artifacts
        # Zig 0.16's Windows arm64 compiler can corrupt shared ZIR entries when
        # concurrent build steps compile the same module.
        run: |
          zig build test -j1
          zig build -Doptimize=ReleaseFast -j1

      - name: CLI smoke
        shell: pwsh
        run: |
          $relate = Join-Path (Get-Location) 'zig-out\bin\relate.exe'
          if (-not (Test-Path -LiteralPath $relate)) { throw "no relate.exe at $relate" }

          $schema = & $relate --schema | ConvertFrom-Json
          if ($schema.tool -ne 'relate' -or -not $schema.version) { throw 'relate --schema carried no tool identity' }

          $rows = & $relate patterns -F -e minimum_zig_version build.zig.zon
          if ($LASTEXITCODE -ne 0 -or -not $rows) { throw 'relate patterns did not find a known literal' }

      - name: Installer is idempotent
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'relate-bin'
          ./install.ps1 -Prefix $prefix -NoIndex
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          ./install.ps1 -Prefix $prefix -NoIndex
          if ($LASTEXITCODE -ne 0) { throw "second install.ps1 exited $LASTEXITCODE" }

          $installed = Join-Path $prefix 'relate.exe'
          if (-not (Test-Path -LiteralPath $installed)) { throw 'installer did not place relate.exe' }
          & $installed --version
          if ($LASTEXITCODE -ne 0) { throw "installed relate.exe exited $LASTEXITCODE" }

  required:
    name: native
    if: always()
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test '${{ needs.native.result }}' = success
