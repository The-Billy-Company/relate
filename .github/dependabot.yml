# Automated dependency updates.
#
# Five updaters, one weekly window. Grouping keeps a quiet week to one pull
# request per language instead of turning freshness into a review queue.
#
# Zig stays manual. Dependabot has no Zig ecosystem, and both package entries
# are sibling path dependencies whose release pins move with an ecosystem cut.
version: 2

updates:
  # These run with the repository token, so stale action pins are the dependency
  # class with the widest blast radius.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["type/deps", "area/ci"]
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /bindings/rust
    schedule:
      interval: weekly
      day: monday
    groups:
      rust:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/rust"]
    cooldown:
      default-days: 7

  # The pinned compiler is part of the crate's behavior; let updates arrive
  # monthly so Clippy churn is deliberate rather than ambient.
  - package-ecosystem: rust-toolchain
    directory: /bindings/rust
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/rust"]
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /bindings/go
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/go"]
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /bindings/python
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/python"]
    cooldown:
      default-days: 7
