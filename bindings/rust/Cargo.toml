# Standalone crate root — lifts out of this repo for a public release without
# inheriting a parent workspace's lockfile or lint config.
[workspace]

[package]
# `relate` on crates.io is an unrelated crate, and crate names are permanent,
# so this takes the same `-search` name the PyPI distribution does. The `[lib]`
# below keeps the identifier callers actually type as `relate`.
name = "relate-search"
version = "1.1.2" # x-release-please-version
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Code similarity search for Rust - find near-duplicate files, clone families, and where a snippet came from, using compression instead of embeddings."
# The crates.io landing page is the repository's own README, not the short one
# beside these sources - crates.io shows a README as the whole project page, and
# a visitor who lands there has nowhere else to look. Cargo has no metadata hook,
# so `tools/registry_readme.py` mints a link-corrected copy here and this points
# at it. Regenerate immediately before `cargo package`, never earlier: a missing
# file fails loudly and a stale one would ship quietly, so absent is the safe
# state to leave it in. The file is gitignored, and `cargo build` never reads it.
readme = "PROJECT_README.md"
homepage = "https://github.com/The-Billy-Company/relate"
repository = "https://github.com/The-Billy-Company/relate"
documentation = "https://github.com/The-Billy-Company/relate/blob/main/bindings/rust/README.md"
authors = [ "The Billy Company" ]
# "kinship", "retrieval", and "sweep" are this crate's internal nouns; nobody
# searches for them. These five are what the problem is called outside.
keywords = [ "similarity", "duplicate-code", "clone-detection", "compression", "code-search" ]
categories = [
  "text-processing",
  "development-tools",
  "compression",
  "algorithms",
  "api-bindings",
]

# `LICENSE` and `NOTICE` are copies of the repository's, kept beside this manifest
# rather than referenced upward: Cargo cannot package a file outside the crate
# directory, so without the copies an Apache-2.0 crate shipped no licence text and
# no attribution notice at all - the two things section 4 of that licence requires a
# redistributor to hand on. Keep them byte-identical to the root pair.
#
# `rust-toolchain.toml` is deliberately not shipped. It pins 1.96.0 so this
# repository's contributors lint identically, which is no business of someone
# building the extracted crate - and it would silently override the 1.85
# `rust-version` above, which is the floor the sources actually ask for.
exclude = [ "/target", "/.cargo", "/rust-toolchain.toml" ]

# Load-bearing, not decorative: the package is `relate-search` on the index, so
# without this the library would be `relate_search` and every caller would have
# to type it. `use relate::…` is the API.
[lib]
name = "relate"

[dependencies]
# Local path for in-tree development. A published build ignores it and resolves
# the same version range of `irgx` through the registry; the path override is
# only for this checkout.
irgx = { version = "2.0.0", path = "../../../irregex/bindings/rust" }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
