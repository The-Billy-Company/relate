# Importable Python face of relate. Depends on the shared `irregex` substrate
# (row protocol, grades, shell transport). Local checkouts resolve the path
# editably; a published wheel depends on the PyPI `irregex` distribution.
#
# The floor tracks the `irregex` substrate's, since this package cannot import
# without it; PEP 695 syntax here makes 3.12 a parse-level requirement too.
# There is no upper bound: the monorepo this was extracted from pins one
# interpreter, but a published library has no business refusing 3.15.
#
# The distribution is `relate-search`; the import stays `relate`. The bare name
# on PyPI belongs to an unrelated author (a discrete-mathematics relation
# library), so publishing under it was never available — and a plain
# `pip install relate` fetches that stranger's package into a tree that then
# imports `relate`. Splitting the two names is the same shape bs4, PIL, and cv2
# already ship, and the same split `gist-search` made next door.

[project]
name = "relate-search"
version = "1.1.2" # x-release-please-version
description = "Code similarity search for Python - find near-duplicate files, clone families, and where a snippet came from, using compression instead of embeddings."
# The long description is the repository's own README, lifted and link-corrected
# at build time by `hatch_readme.py`. PyPI opens onto the project's front door,
# not onto a second one kept beside this file.
dynamic = [ "readme" ]
requires-python = ">=3.12"
license = "Apache-2.0"
# Copies of the repository's pair, kept beside this manifest because a build backend
# packages nothing from above the project directory. Without them the wheel carried an
# SPDX expression and no license text - and no NOTICE, which section 4 of Apache-2.0
# requires a redistributor to hand on. Named here rather than left to the sdist so
# they land in the wheel's `.dist-info/licenses/` too. Keep byte-identical to the root.
license-files = [ "LICENSE", "NOTICE" ]
authors = [ { name = "The Billy Company" } ]
# Nobody searches PyPI for "compression-as-search" - that phrase is the answer,
# not the question. These are the questions: duplicate code, clone detection,
# code similarity, near-duplicate files. The mechanism words (lzjd, minhash,
# ziv-merhav) are here for the smaller audience that arrives knowing the
# literature, and the tool names (jscpd, cpd, simian, moss) for the audience
# already using something else.
keywords = [
  "code-similarity",
  "similarity-search",
  "duplicate-code",
  "duplicate-detection",
  "near-duplicate",
  "clone-detection",
  "code-clones",
  "copy-paste-detector",
  "jscpd",
  "cpd",
  "simian",
  "moss",
  "plagiarism-detection",
  "deduplication",
  "compression",
  "lzjd",
  "ncd",
  "compression-distance",
  "minhash",
  "jaccard",
  "ziv-merhav",
  "information-theory",
  "code-search",
  "retrieval",
  "refactoring",
  "static-analysis",
  "developer-tools",
  "agent-tools",
]
dependencies = [
  # Bounded on both sides. `irgx` is the import this package opens with, and it
  # only exists from 1.0.0 — the 0.1.0 on the index is the pre-rename placeholder,
  # which an unbounded requirement resolves to happily and which cannot satisfy a
  # single line here. The ceiling is the same fact from the other side: 1.0.0 is
  # where the substrate froze the C ABI and the `irgx` surface, and a 2.0 is free
  # to move both. This is a face over an ABI, not a consumer of a loose utility.
  "irregex>=1.0.0,<2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Zig",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Archiving :: Compression",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/The-Billy-Company/relate"
Documentation = "https://github.com/The-Billy-Company/relate#readme"
Repository = "https://github.com/The-Billy-Company/relate"
Issues = "https://github.com/The-Billy-Company/relate/issues"
Changelog = "https://github.com/The-Billy-Company/relate/blob/main/CHANGELOG.md"

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "hatch_readme.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_readme.py"

[tool.hatch.build.targets.wheel]
packages = [ "relate" ]

[tool.uv.sources]
irregex = { path = "../../../irregex/bindings/python", editable = true }
gist-search = { path = "../../../gist/bindings/python", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.15",
  # The build backend, here because `test_description.py` drives the metadata
  # hook that decides what PyPI shows.
  "hatchling>=1.27",
  # distribution `gist-search`, import `gist` — the bare name was taken on PyPI.
  "gist-search", # oracle face for exact-search checks in behavioral tests
]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "SIM" ]
ignore = [ "E501" ]

[tool.ruff.lint.isort]
known-first-party = [ "relate", "irgx", "gist" ]
